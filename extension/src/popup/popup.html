<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRIVIS</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="header-brand">
          <span class="logo">PRIVIS</span>
          <span class="mode-pill" title="On-device visual perception & sanitization">on-dev</span>
        </div>
        <nav class="tab-nav" role="tablist" aria-label="Navigation Tabs">
          <button
            type="button"
            id="tab-btn-chat"
            class="tab-btn active"
            role="tab"
            aria-selected="true"
            aria-controls="tab-chat"
          >
            Chat
          </button>
          <button
            type="button"
            id="tab-btn-transparency"
            class="tab-btn"
            role="tab"
            aria-selected="false"
            aria-controls="tab-transparency"
          >
            Transparency
          </button>
          <button
            type="button"
            id="tab-btn-settings"
            class="tab-btn"
            role="tab"
            aria-selected="false"
            aria-controls="tab-settings"
          >
            Settings
          </button>
        </nav>
      </header>

      <!-- Main Panels -->
      <main class="app-content">
        <!-- Chat Tab -->
        <section id="tab-chat" class="tab-panel active" role="tabpanel" aria-labelledby="tab-btn-chat">
          <div id="session-stream" class="session-stream" aria-live="polite">
            <!-- Populated by Chat.ts -->
          </div>

          <div class="chat-bottom-bar">
            <!-- Session Status Bar -->
            <div id="session-status-bar" class="status-bar">
              <span class="status-indicator status-idle"></span>
              <span id="status-label" class="status-label">idle</span>
            </div>

            <!-- Chat Input Box -->
            <form id="chat-form" class="chat-form" autocomplete="off">
              <input
                id="chat-input"
                type="text"
                class="chat-input"
                placeholder="Give PRIVIS a goal for this page…"
                aria-label="Agent goal prompt"
              />
              <button
                id="send-btn"
                type="submit"
                class="send-btn"
                title="Send goal"
                aria-label="Send goal"
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </form>
          </div>
        </section>

        <!-- Settings Tab -->
        <section id="tab-settings" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-settings">
          <div id="settings-container" class="settings-container">
            <!-- Populated by Settings.ts -->
          </div>
        </section>

        <!-- Transparency Tab -->
        <section id="tab-transparency" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-transparency">
          <div id="transparency-container" class="transparency-container">
            <!-- Populated by Transparency.ts -->
          </div>
        </section>
      </main>
    </div>

    <script src="../../../dist/popup/popup.js"></script>
  </body>
</html>
